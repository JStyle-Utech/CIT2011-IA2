<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Your Ticket - Coding Conf</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header>
      <a href="index.html" aria-label="Coding Conf home">
        <img src="assets/images/logo-full.svg" alt="Coding Conf logo" />
      </a>
    </header>

    <main id="main">
      <!-- congrats message - the name is filled in by ticket.js -->
      <section class="confirmation">
        <h1>
          Congrats, <span id="fullname-display"></span>! Your ticket is ready.
        </h1>
        <p>
          We've emailed your ticket to <span id="email-display"></span> and will
          send updates as the event gets closer.
        </p>
      </section>

      <!-- the glass ticket - every empty spot below is filled by ticket.js -->
      <section class="ticket-section" aria-label="Your conference ticket">
        <article class="ticket">
          <div class="ticket-top">
            <img
              class="ticket-logo"
              src="assets/images/logo-full.svg"
              alt="Coding Conf"
            />
            <p class="ticket-meta">October 26, 2026 / Papine, Kgn</p>
          </div>

          <div class="ticket-person">
            <img id="avatar-display" src="" alt="Your uploaded avatar" />
            <div>
              <h2 id="fullname-ticket"></h2>
              <a id="github-link" href="" target="_blank" rel="noopener">
                <img
                  class="github-icon"
                  src="assets/images/icon-github.svg"
                  alt=""
                />
                <span id="github-text"></span>
              </a>
            </div>
          </div>

          <p class="ticket-number" id="ticket-number"></p>
        </article>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>

    <!-- ticket.js reads localStorage and redirects home if nothing is saved -->
    <script src="js/ticket.js"></script>
  </body>
</html>
